<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Cicada 3301 - Calculadora</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="theme-color" content="#030506">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
--bg: #0E1113;
--card: #0E1113;
--ink: #ECEFF2;
--ink-soft: #8E979F;
--green: #34C759;
--green-deep: #5FD893;
--brick: #C0392B;
--blue: #007AFF;
--orange: #EA580C;
--txt-rojo: #E57366;
--txt-azul: #3D9BFF;
--pill-bg: linear-gradient(180deg,#13171A,#0C0E10) padding-box, linear-gradient(225deg,rgba(60,200,165,.60),rgba(255,255,255,.05) 40%,rgba(255,255,255,.03) 62%,rgba(80,110,230,.55)) border-box;
--pill-shadow: 0 12px 26px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
--pill-raised: 0 14px 28px rgba(0,0,0,.75), 0 3px 6px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04), 0 0 7px rgba(255,255,255,.055), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 4px rgba(0,0,0,.45);
--pill-sunken: inset 4px 4px 12px rgba(0,0,0,.9), inset -1px -1px 3px rgba(255,255,255,.04);
--pill-active: 0 22px 40px rgba(0,0,0,.85), 0 6px 12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05), 0 0 7px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.22);
--pressed: inset 2px 2px 6px rgba(0,0,0,.8), inset -1px -1px 3px rgba(255,255,255,.03);
--divider: rgba(255,255,255,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-tap-highlight-color: transparent; background: #030506; height: 100%; }
body {
font-family: 'Inter', sans-serif;
height: 100%;
overflow: hidden;
background: #030506;
color: var(--ink);
}
/* PANTALLA FLOTANTE */
.marco { position: fixed; top: 7px; bottom: calc(7px + env(safe-area-inset-bottom, 0px)); left: calc(7px + env(safe-area-inset-left, 0px)); right: calc(7px + env(safe-area-inset-right, 0px)); border-radius: 30px; overflow: hidden; isolation: isolate; background: #020304; box-shadow: 0 14px 34px rgba(0,0,0,.9); }
.marco-scroll { position: absolute; inset: 0; z-index: 1; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 56px 20px 70px; }
.marco-curva { position: absolute; inset: 0; z-index: 2; border-radius: 30px; pointer-events: none;
background:
 linear-gradient(180deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.78) 6px,rgba(0,0,0,.58) 14px,rgba(0,0,0,.38) 24px,rgba(0,0,0,.2) 36px,rgba(0,0,0,.08) 48px,transparent 60px),
 linear-gradient(0deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.78) 6px,rgba(0,0,0,.58) 14px,rgba(0,0,0,.38) 24px,rgba(0,0,0,.2) 36px,rgba(0,0,0,.08) 48px,transparent 60px),
 linear-gradient(90deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.78) 2px,rgba(0,0,0,.58) 4px,rgba(0,0,0,.38) 7px,rgba(0,0,0,.2) 11px,rgba(0,0,0,.08) 14px,transparent 18px),
 linear-gradient(270deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.78) 2px,rgba(0,0,0,.58) 4px,rgba(0,0,0,.38) 7px,rgba(0,0,0,.2) 11px,rgba(0,0,0,.08) 14px,transparent 18px); }
.contenedor { width: 100%; max-width: 420px; margin: 0 auto; }
.titulo-con-pildoras { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 28px; margin-top: 6px; }
.titulo-app { flex: 1; text-align: center; }
.titulo-app h1 { margin: 0; font-family: 'Fraunces', serif; font-size: 24px; font-weight: 700; letter-spacing: 0.2px; color: #F2F2F4; }
.titulo-app span { color: #9A9AA2; font-weight: 700; }

.pildora-porcentaje {
display: flex; flex-direction: column; align-items: center;
border: 1px solid transparent; background: var(--pill-bg); border-radius: 16px; padding: 5px 11px 5px 11px; flex-shrink: 0;
box-shadow: var(--pill-sunken);
transition: box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.pildora-porcentaje.levitando {
box-shadow: var(--pill-raised);
transform: translateY(-1px);
}
.pildora-porcentaje:focus-within {
box-shadow: var(--pill-active);
transform: translateY(-2px);
}
.pildora-porcentaje label { font-size: 9px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.pildora-porcentaje input { width: 38px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: var(--ink); text-align: right; padding: 0; background: transparent; border: none; outline: none; }
.pildora-porcentaje span { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-left: 2px; }
.pildora-porcentaje .contenedor-numero { display: flex; align-items: center; justify-content: center; }

.grupo-input {
margin-bottom: 18px; position: relative; border: 1px solid transparent; background: var(--pill-bg); border-radius: 16px; padding: 9px 15px 9px 15px;
box-shadow: var(--pill-sunken);
transition: box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
}
.grupo-input.levitando {
box-shadow: var(--pill-raised);
transform: translateY(-1px);
}
.grupo-input.active {
box-shadow: var(--pill-active);
transform: translateY(-3px);
}
.grupo-input.inactive { opacity: 0.55; }
label { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 3px; padding-left: 2px; }
.input-wrapper { display: flex; align-items: center; width: 100%; position: relative; }
.simbolo { font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); font-weight: 600; font-size: 15px; margin-right: 12px; transition: color 0.3s; }
.grupo-input.active .simbolo { color: var(--blue); }
input { width: 100%; border: none; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; color: var(--ink); outline: none; padding: 4px 0; letter-spacing: 0.3px; }
input::placeholder { color: var(--ink-soft); opacity: 0.5; }
.grupo-input::after { content: ''; position: absolute; bottom: 0; left: 15px; right: 15px; height: 2px; background: var(--divider); border-radius: 2px; opacity: 0.5; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.grupo-input.active::after { height: 3px; background: var(--blue); opacity: 1; box-shadow: 0 0 12px rgba(0, 122, 255, 0.2); }
.input-zanja { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; color: var(--ink); padding: 4px 0; }

#areaResultados { margin-top: 12px; display: none; }
.bloque-resultado {
border: 1px solid transparent; background: var(--pill-bg); border-radius: 18px; padding: 17px 19px; margin-bottom: 18px;
box-shadow: var(--pill-raised);
transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
}
.oculto { opacity: 0; transform: translateY(-15px); pointer-events: none; }
.cabecera-resultado { display: flex; justify-content: flex-start; align-items: center; border-bottom: 1px solid var(--divider); padding-bottom: 10px; margin-bottom: 12px; position: relative; }
.cabecera-resultado.centrada { justify-content: center; }
.cabecera-resultado.centrada .etiqueta-titulo { text-align: center; flex: 1; }
.cabecera-resultado .etiqueta-titulo { font-family: 'Fraunces', serif; font-size: 13.5px; font-weight: 700; color: var(--ink); letter-spacing: 0.2px; }
.badge-porcentaje { position: absolute; right: 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--ink); transition: color 0.3s; letter-spacing: -0.3px; }
.badge-porcentaje.rojo { color: var(--txt-rojo); }
.badge-porcentaje.verde { color: var(--green-deep); }
.badge-porcentaje.azul { color: var(--txt-azul); }
.fila-dato { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; color: var(--ink-soft); }
.fila-dato .etiqueta { font-weight: 400; }
.fila-dato .valor { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--ink); }
.barra-wrapper { position: relative; margin: 12px 0 22px 0; }
.barra-progreso-container { width: 100%; height: 6px; background: rgba(0,0,0,.5); box-shadow: inset 0 1px 3px rgba(0,0,0,.8); border-radius: 4px; overflow: hidden; }
.barra-progreso { height: 100%; border-radius: 4px; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s; }
.barra-progreso.rojo { background: var(--brick); }
.barra-progreso.verde { background: var(--green); }
.barra-progreso.azul { background: var(--blue); }
.barra-etiquetas { position: absolute; top: 12px; left: 0; right: 0; height: 14px; pointer-events: none; }
.barra-etiqueta { position: absolute; transform: translateX(-50%); font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; color: var(--ink-soft); opacity: 0.55; transition: opacity 0.3s, color 0.3s; white-space: nowrap; }
.barra-etiqueta.activa { opacity: 1; font-weight: 700; }
.barra-etiqueta.activa.rojo { color: var(--txt-rojo); }
.barra-etiqueta.activa.verde { color: var(--green-deep); }
.barra-etiqueta.activa.azul { color: var(--txt-azul); }

/* BOTÓN REGISTRAR */
.registrar-container { text-align: center; margin-top: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; }
.registrar-container.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.btn-registrar {
position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px;
border: 1px solid transparent; background: var(--pill-bg); border-radius: 14px; padding: 11px 21px;
font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer;
box-shadow: var(--pill-raised);
transition: all 0.2s ease; isolation: isolate;
}
.btn-registrar:active { box-shadow: var(--pill-sunken); transform: translateY(1px); }
.btn-registrar.guardado { color: var(--green-deep); }
.btn-registrar:disabled { cursor: default; }

/* MODAL DE REGISTRO */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); z-index: 1100; align-items: center; justify-content: center; padding: 20px; transition: background 0.4s ease, backdrop-filter 0.4s ease; }
.modal-overlay.show { display: flex; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal-box { border: 1px solid transparent; background: var(--pill-bg); border-radius: 20px; padding: 25px 21px; max-width: 400px; width: 100%; box-shadow: var(--pill-shadow); opacity: 0; transform: scale(0.06); transition: opacity 0.4s ease, transform 0.48s cubic-bezier(.2,1.2,.3,1); }
.modal-overlay.show .modal-box { opacity: 1; transform: scale(1); }
.modal-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 18px; }
.modal-field { margin-bottom: 16px; }
.modal-field label { display: block; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.modal-field input { width: 100%; border: none; background: rgba(0,0,0,.35); border-radius: 12px; padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 15px; color: var(--ink); outline: none; box-shadow: inset 2px 2px 6px rgba(0,0,0,.8), inset -1px -1px 3px rgba(255,255,255,.04); transition: box-shadow 0.15s ease; }
.modal-field input:focus { box-shadow: inset 3px 3px 8px rgba(0,0,0,.85), inset -1px -1px 4px rgba(255,255,255,.05); }
.modal-resumen { background: transparent; border-radius: 12px; padding: 12px 14px; margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); line-height: 1.7; }
.modal-resumen .fila { display: flex; justify-content: space-between; }
.modal-resumen .fila .k { color: var(--ink-soft); }
.modal-resumen .fila .v { color: var(--ink); font-weight: 600; }
.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.modal-btn { position: relative; overflow: hidden; flex: 1; border: none; border-radius: 14px; padding: 13px 0; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; cursor: pointer; transition: all 0.12s ease; isolation: isolate; }
.modal-btn-cancelar { border: 1px solid transparent; padding: 12px 0; background: var(--pill-bg); color: var(--ink-soft); box-shadow: var(--pill-shadow); }
.modal-btn-cancelar:active { box-shadow: var(--pressed); }
.modal-btn-confirmar { background: var(--blue); color: #FFFFFF; box-shadow: -2px -2px 8px rgba(0,122,255,0.25), 3px 3px 10px rgba(0,122,255,0.35); }
.modal-btn-confirmar:active { transform: scale(0.96); }
.modal-btn-confirmar:disabled { opacity: 0.6; cursor: not-allowed; }
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,0.12); animation: rippleAnim 0.65s ease-out forwards; pointer-events: none; z-index: 0; }
@keyframes rippleAnim { to { transform: scale(2.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="marco" id="marco">
<div class="marco-scroll" id="marcoScroll">
<div class="contenedor" id="appContainer">
<div class="titulo-con-pildoras">
<div class="pildora-porcentaje" id="pildoraDescuento">
<label>Dto</label>
<div class="contenedor-numero">
<input type="text" id="inputDescuento" placeholder="0" inputmode="decimal">
<span>%</span>
</div>
</div>
<div class="titulo-app">
<h1>Cicada <span>3301</span></h1>
</div>
<div class="pildora-porcentaje" id="pildoraIVA">
<label>IVA</label>
<div class="contenedor-numero">
<input type="text" id="inputIVA" placeholder="0" inputmode="decimal">
<span>%</span>
</div>
</div>
</div>
<div id="grupoPaquete" class="grupo-input">
<label>Precio del paquete</label>
<div class="input-wrapper">
<span class="simbolo">₡</span>
<input type="text" id="inputPaquete" placeholder="0" inputmode="decimal">
</div>
</div>
<div id="grupoCantidad" class="grupo-input">
<label>Unidades</label>
<div class="input-wrapper">
<span class="simbolo">#</span>
<input type="text" id="inputCantidad" placeholder="0" inputmode="numeric">
</div>
</div>
<div id="grupoCosto" class="grupo-input" style="display:none;">
<label>Costo por unidad</label>
<div class="input-wrapper">
<span class="simbolo">₡</span>
<div class="input-zanja" id="textoCostoAuto">0</div>
</div>
</div>
<div id="grupoVenta" class="grupo-input">
<label>Precio de venta</label>
<div class="input-wrapper">
<span class="simbolo">₡</span>
<input type="text" id="inputVenta" placeholder="0" inputmode="decimal">
</div>
</div>
<div id="areaResultados">
<div id="bloqueUnidad" class="bloque-resultado oculto">
<div class="cabecera-resultado">
<span class="etiqueta-titulo">Margen por unidad</span>
<span id="badgeUnidad" class="badge-porcentaje">0%</span>
</div>
<div class="fila-dato"><span class="etiqueta">Ganancia por unidad</span><span class="valor" id="gananciaUnidad">₡0</span></div>
<div class="barra-wrapper">
<div class="barra-progreso-container"><div id="barraUnidad" class="barra-progreso" style="width: 0%;"></div></div>
<div class="barra-etiquetas">
<span class="barra-etiqueta" data-cat="bajo" id="etiqUnidadBajo" style="left:10%;">Bajo</span>
<span class="barra-etiqueta" data-cat="saludable" id="etiqUnidadSaludable" style="left:50%;">Saludable</span>
<span class="barra-etiqueta" data-cat="optimo" id="etiqUnidadOptimo" style="left:90%;">Óptimo</span>
</div>
</div>
</div>
<div id="bloquePaquete" class="bloque-resultado oculto">
<div class="cabecera-resultado centrada">
<span class="etiqueta-titulo">Totales del paquete</span>
</div>
<div class="fila-dato"><span class="etiqueta">Inversión total</span><span class="valor" id="inversionPaquete">₡0</span></div>
<div class="fila-dato"><span class="etiqueta">Ingreso total</span><span class="valor" id="ingresoPaquete">₡0</span></div>
<div class="fila-dato"><span class="etiqueta">Ganancia por paquete</span><span class="valor" id="gananciaPaquete">₡0</span></div>
</div>
</div>
<div class="registrar-container" id="registrarContainer">
<button class="btn-registrar" id="btnRegistrar">
<span>Registrar</span>
</button>
</div>
</div>
</div>
<div class="marco-curva"></div>
</div>

<div class="modal-overlay" id="modalRegistrar">
<div class="modal-box">
<div class="modal-title">Registrar producto</div>
<div class="modal-field">
<label for="registrarNombre">Nombre del producto</label>
<input type="text" id="registrarNombre" placeholder="Ej: Coca Cola 3L" autocomplete="off">
</div>
<div class="modal-resumen" id="modalResumen">
<div class="fila"><span class="k">Compra</span><span class="v" id="resumenCompra">---</span></div>
<div class="fila"><span class="k">Venta</span><span class="v" id="resumenVenta">---</span></div>
</div>
<div class="modal-actions">
<button class="modal-btn modal-btn-cancelar" id="btnCancelarRegistrar">Cancelar</button>
<button class="modal-btn modal-btn-confirmar" id="btnConfirmarRegistrar">Registrar</button>
</div>
</div>
</div>

<script>
(function() {
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbxe4L4Z76NIBjDKxDp_t579_94XJEDAo1pO-JYr_aPwm0j3OvPgHvNiwVf-yd6xoURc/exec';

const contenedorApp = document.getElementById('appContainer');
const inputP = document.getElementById('inputPaquete');
const inputDescuento = document.getElementById('inputDescuento');
const inputIVA = document.getElementById('inputIVA');
const inputC = document.getElementById('inputCantidad');
const inputV = document.getElementById('inputVenta');

const grupos = {
paquete: document.getElementById('grupoPaquete'),
cantidad: document.getElementById('grupoCantidad'),
costo: document.getElementById('grupoCosto'),
venta: document.getElementById('grupoVenta')
};

const pildoraDescuento = document.getElementById('pildoraDescuento');
const pildoraIVA = document.getElementById('pildoraIVA');
const areaResultados = document.getElementById('areaResultados');
const spanCosto = document.getElementById('textoCostoAuto');
const badgeUnidad = document.getElementById('badgeUnidad');
const barraUnidad = document.getElementById('barraUnidad');

const etiquetasUnidad = {
bajo: document.getElementById('etiqUnidadBajo'),
saludable: document.getElementById('etiqUnidadSaludable'),
optimo: document.getElementById('etiqUnidadOptimo')
};

const registrarContainer = document.getElementById('registrarContainer');
const btnRegistrar = document.getElementById('btnRegistrar');
const modalRegistrar = document.getElementById('modalRegistrar');
const registrarNombre = document.getElementById('registrarNombre');
const resumenCompra = document.getElementById('resumenCompra');
const resumenVenta = document.getElementById('resumenVenta');
const btnCancelarRegistrar = document.getElementById('btnCancelarRegistrar');
const btnConfirmarRegistrar = document.getElementById('btnConfirmarRegistrar');

let timeoutId;
let ultimoCostoCalculado = null;
let ultimoVentaCalculado = null;
let registroExitoso = false;

function formatearPorcentaje(p) {
const redondeado = Math.round(p * 10) / 10;
if (Number.isInteger(redondeado)) { return redondeado.toFixed(0) + '%'; }
return redondeado.toFixed(1) + '%';
}

function activarLevitacion(el) {
if (!el) return;
const input = el.querySelector('input');
const tieneTexto = input && input.value.trim() !== '';
if (tieneTexto) { el.classList.add('levitando'); } else { el.classList.remove('levitando'); }
}

function actualizarTodasLasLevitaciones() {
activarLevitacion(grupos.paquete);
activarLevitacion(grupos.cantidad);
activarLevitacion(grupos.venta);
activarLevitacion(pildoraDescuento);
activarLevitacion(pildoraIVA);
}

function guardarEstadoCampos() {
try {
const estado = { paquete: inputP.value, descuento: inputDescuento.value, iva: inputIVA.value, cantidad: inputC.value, venta: inputV.value };
localStorage.setItem('pulhEstadoCampos', JSON.stringify(estado));
} catch (e) {}
}

function restaurarEstadoCampos() {
try {
const data = localStorage.getItem('pulhEstadoCampos');
if (!data) return;
const estado = JSON.parse(data);
inputP.value = estado.paquete || '';
inputDescuento.value = estado.descuento || '';
inputIVA.value = estado.iva || '';
inputC.value = estado.cantidad || '';
inputV.value = estado.venta || '';
} catch (e) {}
}

function parseCRNumber(val) {
if (!val || val.trim() === '') return NaN;
let cleaned = val.replace(/[^\d.,]/g, '');
let lastCommaIndex = cleaned.lastIndexOf(',');
if (lastCommaIndex !== -1) {
cleaned = cleaned.substring(0, lastCommaIndex).replace(/\./g, '') + '.' + cleaned.substring(lastCommaIndex + 1);
} else {
cleaned = cleaned.replace(/\./g, '');
}
return parseFloat(cleaned);
}

function formatCRNumber(num) {
if (isNaN(num) || !isFinite(num)) return '₡0';
const redondeado = Math.round(num * 100) / 100;
let fixed = redondeado.toFixed(2);
let parts = fixed.split('.');
let entero = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
let decimales = parts[1];
if (decimales === '00') { return '₡' + entero; }
return '₡' + entero + ',' + decimales;
}

function clasificarMargen(porcentaje) {
if (porcentaje < 20) return 'rojo';
if (porcentaje < 35) return 'verde';
return 'azul';
}

function calcularAnchoBarra(porcentaje) {
const ancho = porcentaje * (100 / 60);
if (ancho < 0) return 0;
if (ancho > 100) return 100;
return ancho;
}

function actualizarBarra(porcentaje, elementoBarra, etiquetas) {
const color = clasificarMargen(porcentaje);
const ancho = calcularAnchoBarra(porcentaje);
elementoBarra.className = 'barra-progreso ' + color;
elementoBarra.style.width = ancho + '%';
Object.keys(etiquetas).forEach(function(key) { etiquetas[key].className = 'barra-etiqueta'; });
etiquetas[color === 'rojo' ? 'bajo' : (color === 'verde' ? 'saludable' : 'optimo')].classList.add('activa', color);
return color;
}

function lanzarRipple(e) {
const btn = e.currentTarget;
const rect = btn.getBoundingClientRect();
const size = Math.max(rect.width, rect.height);
const span = document.createElement('span');
span.className = 'ripple';
span.style.width = span.style.height = size + 'px';
span.style.left = (e.clientX - rect.left - size / 2) + 'px';
span.style.top = (e.clientY - rect.top - size / 2) + 'px';
btn.appendChild(span);
setTimeout(function() { span.remove(); }, 650);
}

function setFocus(grupoId) {
Object.values(grupos).forEach(function(el) { el.classList.remove('active', 'inactive'); });
if (grupoId) {
Object.keys(grupos).forEach(function(key) {
if (grupos[key].id !== grupoId && grupos[key].style.display !== 'none') { grupos[key].classList.add('inactive'); }
});
document.getElementById(grupoId).classList.add('active');
}
}

inputP.addEventListener('focus', function() { setFocus('grupoPaquete'); });
inputC.addEventListener('focus', function() { setFocus('grupoCantidad'); });
inputV.addEventListener('focus', function() { setFocus('grupoVenta'); });

document.addEventListener('click', function(e) {
if (!e.target.closest('.pildora-porcentaje') && !e.target.closest('.grupo-input')) {
Object.values(grupos).forEach(function(el) { el.classList.remove('active', 'inactive'); });
}
});

function limpiarUI() {
areaResultados.style.display = 'none';
grupos.costo.style.display = 'none';
grupos.costo.classList.remove('levitando');
document.getElementById('bloqueUnidad').classList.add('oculto');
document.getElementById('bloquePaquete').classList.add('oculto');
ultimoCostoCalculado = null;
ultimoVentaCalculado = null;
}

function actualizarVisibilidadRegistrar() {
const precioBase = parseCRNumber(inputP.value);
const qty = parseCRNumber(inputC.value);
const sell = parseCRNumber(inputV.value);
const tienePrecio = !isNaN(precioBase) && precioBase > 0;
const tieneCantidad = !isNaN(qty) && qty > 0;
const tieneVenta = !isNaN(sell) && sell > 0;
const tieneCosto = ultimoCostoCalculado !== null && isFinite(ultimoCostoCalculado) && ultimoCostoCalculado > 0;
const todosLlenos = tienePrecio && tieneCantidad && tieneVenta && tieneCosto;
if (todosLlenos) { registrarContainer.classList.add('visible'); } else { registrarContainer.classList.remove('visible'); }
}

function calcular() {
const precioBase = parseCRNumber(inputP.value);
const descuento = parseFloat(inputDescuento.value);
const iva = parseFloat(inputIVA.value);
const qty = parseCRNumber(inputC.value);
const sell = parseCRNumber(inputV.value);

if (isNaN(precioBase) || isNaN(qty) || qty <= 0) {
limpiarUI();
actualizarVisibilidadRegistrar();
return;
}

let precioFinalCompra = precioBase;
if (descuento > 0) { precioFinalCompra = precioBase - (precioBase * (descuento / 100)); }
let costoConIVA = precioFinalCompra;
if (iva > 0) { costoConIVA = precioFinalCompra * (1 + (iva / 100)); }
const costoUnitario = costoConIVA / qty;

spanCosto.innerText = formatCRNumber(costoUnitario);
grupos.costo.style.display = 'block';
grupos.costo.classList.add('levitando');
ultimoCostoCalculado = costoUnitario;

if (isNaN(sell) || sell <= 0) {
document.getElementById('bloqueUnidad').classList.add('oculto');
document.getElementById('bloquePaquete').classList.add('oculto');
areaResultados.style.display = 'block';
ultimoVentaCalculado = null;
actualizarVisibilidadRegistrar();
return;
}

areaResultados.style.display = 'block';
ultimoVentaCalculado = sell;

const gananciaUnidad = sell - costoUnitario;
const porcentajeUnidad = (gananciaUnidad / sell) * 100;
const inversionTotal = costoUnitario * qty;
const ingresoTotal = sell * qty;
const gananciaTotal = ingresoTotal - inversionTotal;

document.getElementById('gananciaUnidad').innerText = formatCRNumber(gananciaUnidad);
document.getElementById('inversionPaquete').innerText = formatCRNumber(inversionTotal);
document.getElementById('ingresoPaquete').innerText = formatCRNumber(ingresoTotal);
document.getElementById('gananciaPaquete').innerText = formatCRNumber(gananciaTotal);

const colorUnidad = actualizarBarra(porcentajeUnidad, barraUnidad, etiquetasUnidad);
badgeUnidad.className = 'badge-porcentaje ' + colorUnidad;
badgeUnidad.innerText = formatearPorcentaje(porcentajeUnidad);

document.getElementById('bloqueUnidad').classList.remove('oculto');

if (qty > 1) { document.getElementById('bloquePaquete').classList.remove('oculto'); } else { document.getElementById('bloquePaquete').classList.add('oculto'); }
actualizarVisibilidadRegistrar();
}

function scheduleCalculation() {
clearTimeout(timeoutId);
timeoutId = setTimeout(calcular, 150);
}

function applyLiveFormatting(input) {
let raw = input.value.replace(/[^\d.,]/g, '');
if (!raw.includes(',') || raw.split(',').length !== 2) {
let num = parseCRNumber(raw);
if (!isNaN(num) && isFinite(num)) {
let intPart = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
input.value = intPart;
}
}
}

function marcarRegistrado() {
registroExitoso = true;
btnRegistrar.classList.add('guardado');
btnRegistrar.disabled = true;
btnRegistrar.querySelector('span').innerText = 'Guardado';
}

function resetearRegistrado() {
if (!registroExitoso) return;
registroExitoso = false;
btnRegistrar.classList.remove('guardado');
btnRegistrar.disabled = false;
btnRegistrar.querySelector('span').innerText = 'Registrar';
}

function abrirModalRegistrar(e) {
if (registroExitoso) return;
lanzarRipple(e);
resumenCompra.innerText = (ultimoCostoCalculado && isFinite(ultimoCostoCalculado)) ? formatCRNumber(ultimoCostoCalculado) : '---';
resumenVenta.innerText = (ultimoVentaCalculado && isFinite(ultimoVentaCalculado)) ? formatCRNumber(ultimoVentaCalculado) : '---';
registrarNombre.value = '';
modalRegistrar.classList.add('show');
setTimeout(function() { registrarNombre.focus(); }, 300);
}

function cerrarModalRegistrar() {
modalRegistrar.classList.remove('show');
}

// ============================================================
// AQUÍ ESTÁ LA CIRUGÍA: ENVIAR REGISTRO A GOOGLE Y LOYVERSE
// ============================================================
function enviarRegistro() {
const nombre = registrarNombre.value.trim();
if (!nombre) {
registrarNombre.focus();
return;
}

const payload = {
action: 'registrarProducto',
nombre: nombre,
costo: (ultimoCostoCalculado && isFinite(ultimoCostoCalculado)) ? ultimoCostoCalculado : '',
precioVenta: (ultimoVentaCalculado && isFinite(ultimoVentaCalculado)) ? ultimoVentaCalculado : ''
};

btnConfirmarRegistrar.disabled = true;
btnConfirmarRegistrar.innerText = 'Enviando...';

fetch(API_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify(payload)
})
.then(function(response) {
return response.json();
})
.then(function(data) {
if (data.success) {
cerrarModalRegistrar();
marcarRegistrado();
} else {
alert('Atención: ' + data.message);
}
})
.catch(function(error) {
alert('Error de conexión. Revisá tu internet.');
})
.finally(function() {
btnConfirmarRegistrar.disabled = false;
btnConfirmarRegistrar.innerText = 'Registrar';
});
}

btnRegistrar.addEventListener('click', abrirModalRegistrar);

btnCancelarRegistrar.addEventListener('click', function(e) {
lanzarRipple(e);
cerrarModalRegistrar();
});

btnConfirmarRegistrar.addEventListener('click', enviarRegistro);

modalRegistrar.addEventListener('click', function(ev) {
if (ev.target === this) cerrarModalRegistrar();
});

registrarNombre.addEventListener('keydown', function(ev) {
if (ev.key === 'Enter') {
ev.preventDefault();
enviarRegistro();
}
});

inputP.addEventListener('input', function() {
applyLiveFormatting(this);
activarLevitacion(grupos.paquete);
scheduleCalculation();
guardarEstadoCampos();
resetearRegistrado();
});

inputDescuento.addEventListener('input', function() {
activarLevitacion(pildoraDescuento);
scheduleCalculation();
guardarEstadoCampos();
resetearRegistrado();
});

inputIVA.addEventListener('input', function() {
activarLevitacion(pildoraIVA);
scheduleCalculation();
guardarEstadoCampos();
resetearRegistrado();
});

inputC.addEventListener('input', function() {
this.value = this.value.replace(/[^\d]/g, '');
activarLevitacion(grupos.cantidad);
scheduleCalculation();
guardarEstadoCampos();
resetearRegistrado();
});

inputV.addEventListener('input', function() {
applyLiveFormatting(this);
activarLevitacion(grupos.venta);
scheduleCalculation();
guardarEstadoCampos();
resetearRegistrado();
});

limpiarUI();
restaurarEstadoCampos();
actualizarTodasLasLevitaciones();
calcular();

})();
</script>
<script>
// SCROLL INTERNO DEL MARCO
(function() {
'use strict';

const marcoScroll = document.getElementById('marcoScroll');
let timeoutTeclado;

// Con el teclado abierto, mantener a la vista el campo en uso dentro del marco
function mantenerCampoVisible() {
const el = document.activeElement;
if (el && el.tagName === 'INPUT' && marcoScroll.contains(el)) {
el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
}

window.addEventListener('resize', function() {
clearTimeout(timeoutTeclado);
timeoutTeclado = setTimeout(mantenerCampoVisible, 120);
});
})();
</script>
