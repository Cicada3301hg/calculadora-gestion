<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cicada 3301 - Calculadora</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <meta name="theme-color" content="#EEF0F3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cicada 3301">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root{
      --bg: #EEF0F3;
      --card: #EEF0F3;
      --ink: #2B2F36;
      --ink-soft: #868C97;
      --green: #34C759;
      --green-deep: #1F6E52;
      --brick: #C0392B;
      --blue: #007AFF;
      --orange: #EA580C;
      --shadow-dark: #C8CCD2;
      --shadow-dark-strong: #A6ACB7;
      --shadow-light: #FFFFFF;
      --shadow-ambient: rgba(112, 122, 138, 0.28);
      --shadow-ambient-soft: rgba(112, 122, 138, 0.16);
      --highlight-edge: rgba(255, 255, 255, 0.75);
      --divider: #D4D8DE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 22px 20px 40px;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
    }

    .titulo-con-pildoras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 28px;
      margin-top: 6px;
    }

    .titulo-app {
      flex: 1;
      text-align: center;
    }
    .titulo-app h1 {
      margin: 0;
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--ink);
    }
    .titulo-app span {
      color: var(--ink-soft);
      font-weight: 700;
    }

    .pildora-porcentaje {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--card);
      border-radius: 16px;
      padding: 6px 12px 6px 12px;
      flex-shrink: 0;
      box-shadow:
        inset 3px 3px 6px var(--shadow-dark-strong),
        inset -2px -2px 5px var(--shadow-light);
      transition: box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pildora-porcentaje.levitando {
      box-shadow:
        -4px -4px 10px var(--shadow-light),
        4px 4px 10px var(--shadow-dark-strong),
        6px 6px 18px var(--shadow-ambient-soft);
      transform: translateY(-1px);
    }
    .pildora-porcentaje:focus-within {
      box-shadow:
        -5px -5px 12px var(--shadow-light),
        5px 5px 12px var(--shadow-dark-strong),
        8px 8px 22px var(--shadow-ambient),
        inset 1px 1px 0 var(--highlight-edge);
      transform: translateY(-2px);
    }
    .pildora-porcentaje label {
      font-size: 9px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .pildora-porcentaje input {
      width: 38px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      text-align: right;
      padding: 0;
      background: transparent;
      border: none;
      outline: none;
    }
    .pildora-porcentaje span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-left: 2px;
    }
    .pildora-porcentaje .contenedor-numero {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grupo-input {
      margin-bottom: 18px;
      position: relative;
      background: var(--card);
      border-radius: 16px;
      padding: 10px 16px 10px 16px;
      box-shadow:
        inset 4px 4px 10px var(--shadow-dark-strong),
        inset -3px -3px 8px var(--shadow-light);
      transition: box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.3s ease;
    }
    .grupo-input.levitando {
      box-shadow:
        -6px -6px 14px var(--shadow-light),
        6px 6px 14px var(--shadow-dark-strong),
        10px 10px 26px var(--shadow-ambient-soft);
      transform: translateY(-1px);
    }
    .grupo-input.active {
      box-shadow:
        -9px -9px 20px var(--shadow-light),
        9px 9px 20px var(--shadow-dark-strong),
        14px 14px 36px var(--shadow-ambient),
        inset 1px 1px 0 var(--highlight-edge);
      transform: translateY(-3px);
    }
    .grupo-input.inactive { opacity: 0.55; }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 3px;
      padding-left: 2px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      position: relative;
    }

    .simbolo {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--ink-soft);
      font-weight: 600;
      font-size: 15px;
      margin-right: 12px;
      transition: color 0.3s;
    }
    .grupo-input.active .simbolo { color: var(--blue); }

    input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 19px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      padding: 4px 0;
      letter-spacing: 0.3px;
    }
    input::placeholder { color: var(--ink-soft); opacity: 0.5; }

    .grupo-input::after {
      content: '';
      position: absolute;
      bottom: 0; left: 16px; right: 16px;
      height: 2px;
      background: var(--divider);
      border-radius: 2px;
      opacity: 0.5;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .grupo-input.active::after {
      height: 3px;
      background: var(--blue);
      opacity: 1;
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.2);
    }

    .input-zanja {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 19px;
      font-weight: 600;
      color: var(--ink);
      padding: 4px 0;
    }

    #areaResultados { margin-top: 12px; display: none; }

    .bloque-resultado {
      background: var(--card);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow:
        -7px -7px 16px var(--shadow-light),
        7px 7px 16px var(--shadow-dark-strong),
        16px 16px 40px var(--shadow-ambient),
        inset 1px 1px 0 var(--highlight-edge);
      transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
    }
    .oculto {
      opacity: 0;
      transform: translateY(-15px);
      pointer-events: none;
    }

    .cabecera-resultado {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 1px solid var(--divider);
      padding-bottom: 10px;
      margin-bottom: 12px;
      position: relative;
    }
    .cabecera-resultado.centrada {
      justify-content: center;
    }
    .cabecera-resultado.centrada .etiqueta-titulo {
      text-align: center;
      flex: 1;
    }
    .cabecera-resultado .etiqueta-titulo {
      font-family: 'Fraunces', serif;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.2px;
    }
    .badge-porcentaje {
      position: absolute;
      right: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      transition: color 0.3s;
      letter-spacing: -0.3px;
    }
    .badge-porcentaje.rojo { color: var(--brick); }
    .badge-porcentaje.verde { color: var(--green-deep); }
    .badge-porcentaje.azul { color: var(--blue); }

    .fila-dato {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 14px;
      color: var(--ink-soft);
    }
    .fila-dato .etiqueta { font-weight: 400; }
    .fila-dato .valor {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--ink);
    }

    .barra-wrapper {
      position: relative;
      margin: 12px 0 22px 0;
    }
    .barra-progreso-container {
      width: 100%;
      height: 6px;
      background: var(--shadow-dark);
      border-radius: 4px;
      overflow: hidden;
    }
    .barra-progreso {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s;
    }
    .barra-progreso.rojo { background: var(--brick); }
    .barra-progreso.verde { background: var(--green); }
    .barra-progreso.azul { background: var(--blue); }

    .barra-etiquetas {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      height: 14px;
      pointer-events: none;
    }
    .barra-etiqueta {
      position: absolute;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--ink-soft);
      opacity: 0.55;
      transition: opacity 0.3s, color 0.3s;
      white-space: nowrap;
    }
    .barra-etiqueta.activa {
      opacity: 1;
      font-weight: 700;
    }
    .barra-etiqueta.activa.rojo { color: var(--brick); }
    .barra-etiqueta.activa.verde { color: var(--green-deep); }
    .barra-etiqueta.activa.azul { color: var(--blue); }

    .historial-container {
      text-align: center;
      margin-top: 12px;
    }
    .btn-historial {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: none;
      border-radius: 14px;
      padding: 12px 22px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      box-shadow:
        -4px -4px 10px var(--shadow-light),
        4px 4px 10px var(--shadow-dark-strong),
        9px 9px 24px var(--shadow-ambient-soft),
        inset 1px 1px 0 var(--highlight-edge);
      transition: all 0.12s ease;
      isolation: isolate;
    }
    .btn-historial:active {
      box-shadow:
        inset -2px -2px 6px var(--shadow-light),
        inset 2px 2px 6px var(--shadow-dark-strong);
      transform: translateY(1px);
    }
    .btn-historial svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .historial-lista {
      display: none;
      margin-top: 16px;
      background: var(--card);
      border-radius: 16px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      box-shadow:
        -6px -6px 14px var(--shadow-light),
        6px 6px 14px var(--shadow-dark-strong),
        14px 14px 34px var(--shadow-ambient-soft);
      transition: max-height 0.4s ease, padding 0.3s ease;
    }
    .historial-lista.abierto {
      max-height: 340px;
      overflow-y: auto;
      padding: 14px 18px;
    }
    .item-historial {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--divider);
      font-size: 13px;
      color: var(--ink);
    }
    .item-historial:last-child { border-bottom: none; }
    .item-historial .left {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      color: var(--ink-soft);
    }
    .item-historial .right {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--ink);
    }
    .historial-empty {
      text-align: center;
      color: var(--ink-soft);
      font-size: 13px;
      padding: 15px;
    }
    .historial-lista::-webkit-scrollbar { width: 4px; }
    .historial-lista::-webkit-scrollbar-track { background: transparent; }
    .historial-lista::-webkit-scrollbar-thumb {
      background: var(--shadow-dark);
      border-radius: 4px;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(0,0,0,0.10);
      animation: rippleAnim 0.65s ease-out forwards;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes rippleAnim {
      to { transform: scale(2.8); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head><body>

<div class="contenedor" id="appContainer">

  <div class="titulo-con-pildoras">
    <div class="pildora-porcentaje" id="pildoraDescuento">
      <label>Dto</label>
      <div class="contenedor-numero">
        <input type="text" id="inputDescuento" placeholder="0" inputmode="decimal">
        <span>%</span>
      </div>
    </div>
    <div class="titulo-app">
      <h1>Cicada <span>3301</span></h1>
    </div><div class="pildora-porcentaje" id="pildoraIVA">
      <label>IVA</label>
      <div class="contenedor-numero">
        <input type="text" id="inputIVA" placeholder="0" inputmode="decimal">
        <span>%</span>
      </div>
    </div>
  </div>

  <div id="grupoPaquete" class="grupo-input">
    <label>Precio del paquete</label>
    <div class="input-wrapper">
      <span class="simbolo">₡</span>
      <input type="text" id="inputPaquete" placeholder="0" inputmode="decimal">
    </div>
  </div>

  <div id="grupoCantidad" class="grupo-input">
    <label>Unidades</label>
    <div class="input-wrapper">
      <span class="simbolo">#</span>
      <input type="text" id="inputCantidad" placeholder="0" inputmode="numeric">
    </div>
  </div>

  <div id="grupoCosto" class="grupo-input" style="display:none;">
    <label>Costo por unidad</label>
    <div class="input-wrapper">
      <span class="simbolo">₡</span>
      <div class="input-zanja" id="textoCostoAuto">0</div>
    </div>
  </div>

  <div id="grupoVenta" class="grupo-input">
    <label>Precio de venta</label>
    <div class="input-wrapper">
      <span class="simbolo">₡</span>
      <input type="text" id="inputVenta" placeholder="0" inputmode="decimal">
    </div>
  </div>

  <div id="areaResultados">
    <div id="bloqueUnidad" class="bloque-resultado oculto">
      <div class="cabecera-resultado">
        <span class="etiqueta-titulo">Margen por unidad</span>
        <span id="badgeUnidad" class="badge-porcentaje">0%</span>
      </div>
      <div class="fila-dato"><span class="etiqueta">Ganancia por unidad</span><span class="valor" id="gananciaUnidad">₡0</span></div>
      <div class="barra-wrapper">
        <div class="barra-progreso-container"><div id="barraUnidad" class="barra-progreso" style="width: 0%;"></div></div>
        <div class="barra-etiquetas">
          <span class="barra-etiqueta" data-cat="bajo" id="etiqUnidadBajo" style="left:10%;">Bajo</span>
          <span class="barra-etiqueta" data-cat="saludable" id="etiqUnidadSaludable" style="left:50%;">Saludable</span>
          <span class="barra-etiqueta" data-cat="optimo" id="etiqUnidadOptimo" style="left:90%;">Óptimo</span>
        </div>
      </div>
    </div>

    <div id="bloquePaquete" class="bloque-resultado oculto">
      <div class="cabecera-resultado centrada">
        <span class="etiqueta-titulo">Totales del paquete</span>
      </div>
      <div class="fila-dato"><span class="etiqueta">Inversión total</span><span class="valor" id="inversionPaquete">₡0</span></div>
      <div class="fila-dato"><span class="etiqueta">Ingreso total</span><span class="valor" id="ingresoPaquete">₡0</span></div>
      <div class="fila-dato"><span class="etiqueta">Ganancia por paquete</span><span class="valor" id="gananciaPaquete">₡0</span></div>
    </div>

    <div class="historial-container">
      <button class="btn-historial" id="btnHistorial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v5h5"></path>
          <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
          <path d="M12 7v5l4 2"></path>
        </svg>
        <span>Ver historial</span>
      </button>
      <div id="historialLista" class="historial-lista">
        <div class="historial-empty">Aún sin cálculos</div>
      </div>
    </div>
  </div>

</div>

<script>
  (function() {
    'use strict';

    const contenedorApp = document.getElementById('appContainer');
    const inputP = document.getElementById('inputPaquete');
    const inputDescuento = document.getElementById('inputDescuento');
    const inputIVA = document.getElementById('inputIVA');
    const inputC = document.getElementById('inputCantidad');
    const inputV = document.getElementById('inputVenta');

    const grupos = {
      paquete: document.getElementById('grupoPaquete'),
      cantidad: document.getElementById('grupoCantidad'),
      costo: document.getElementById('grupoCosto'),
      venta: document.getElementById('grupoVenta')
    };

    const pildoraDescuento = document.getElementById('pildoraDescuento');
    const pildoraIVA = document.getElementById('pildoraIVA');

    const areaResultados = document.getElementById('areaResultados');
    const spanCosto = document.getElementById('textoCostoAuto');
    const badgeUnidad = document.getElementById('badgeUnidad');
    const barraUnidad = document.getElementById('barraUnidad');
    const historialLista = document.getElementById('historialLista');
    const btnHistorial = document.getElementById('btnHistorial');

    const etiquetasUnidad = {
      bajo: document.getElementById('etiqUnidadBajo'),
      saludable: document.getElementById('etiqUnidadSaludable'),
      optimo: document.getElementById('etiqUnidadOptimo')
    };

    let historial = [];
    let ultimoRegistroGuardado = null;
    let timeoutId;

    function formatearPorcentaje(p) {
      const redondeado = Math.round(p * 10) / 10;
      if (Number.isInteger(redondeado)) {
        return redondeado.toFixed(0) + '%';
      }
      return redondeado.toFixed(1) + '%';
    }

    function activarLevitacion(el) {
      if (!el) return;
      const input = el.querySelector('input');
      const tieneTexto = input && input.value.trim() !== '';
      if (tieneTexto) {
        el.classList.add('levitando');
      } else {
        el.classList.remove('levitando');
      }
    }

    function actualizarTodasLasLevitaciones() {
      activarLevitacion(grupos.paquete);
      activarLevitacion(grupos.cantidad);
      activarLevitacion(grupos.venta);
      activarLevitacion(pildoraDescuento);
      activarLevitacion(pildoraIVA);
    }

    // ---------- GUARDAR Y RESTAURAR ESTADO DE LOS CAMPOS ----------
    function guardarEstadoCampos() {
      try {
        const estado = {
          paquete: inputP.value,
          descuento: inputDescuento.value,
          iva: inputIVA.value,
          cantidad: inputC.value,
          venta: inputV.value
        };
        localStorage.setItem('pulhEstadoCampos', JSON.stringify(estado));
      } catch (e) {}
    }

    function restaurarEstadoCampos() {
      try {
        const data = localStorage.getItem('pulhEstadoCampos');
        if (!data) return;
        const estado = JSON.parse(data);
        inputP.value = estado.paquete || '';
        inputDescuento.value = estado.descuento || '';
        inputIVA.value = estado.iva || '';
        inputC.value = estado.cantidad || '';
        inputV.value = estado.venta || '';
      } catch (e) {}
    }

    function parseCRNumber(val) {
      if (!val || val.trim() === '') return NaN;
      let cleaned = val.replace(/[^\d.,]/g, '');
      let lastCommaIndex = cleaned.lastIndexOf(',');
      if (lastCommaIndex !== -1) {
        cleaned = cleaned.substring(0, lastCommaIndex).replace(/\./g, '') + '.' + cleaned.substring(lastCommaIndex + 1);
      } else {
        cleaned = cleaned.replace(/\./g, '');
      }
      return parseFloat(cleaned);
    }

    function formatCRNumber(num) {
      if (isNaN(num) || !isFinite(num)) return '₡0';
      const redondeado = Math.round(num * 100) / 100;
      let fixed = redondeado.toFixed(2);
      let parts = fixed.split('.');
      let entero = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      let decimales = parts[1];

      if (decimales === '00') {
        return '₡' + entero;
      }
      return '₡' + entero + ',' + decimales;
    }

    function clasificarMargen(porcentaje) {
      if (porcentaje < 20) return 'rojo';
      if (porcentaje < 35) return 'verde';
      return 'azul';
    }

    function calcularAnchoBarra(porcentaje) {
      const ancho = porcentaje * (100 / 60);
      if (ancho < 0) return 0;
      if (ancho > 100) return 100;
      return ancho;
    }

    function actualizarBarra(porcentaje, elementoBarra, etiquetas) {
      const color = clasificarMargen(porcentaje);
      const ancho = calcularAnchoBarra(porcentaje);

      elementoBarra.className = 'barra-progreso ' + color;
      elementoBarra.style.width = ancho + '%';

      Object.keys(etiquetas).forEach(function(key) {
        etiquetas[key].className = 'barra-etiqueta';
      });
      etiquetas[color === 'rojo' ? 'bajo' : (color === 'verde' ? 'saludable' : 'optimo')]
        .classList.add('activa', color);

      return color;
    }

    function lanzarRipple(e) {
      const btn = e.currentTarget;
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(span);
      setTimeout(function() { span.remove(); }, 650);
    }

    function cargarHistorial() {
      try {
        const data = localStorage.getItem('pulhHistorial');
        if (data) historial = JSON.parse(data);
      } catch (e) { historial = []; }
    }
    function guardarHistorial() {
      try { localStorage.setItem('pulhHistorial', JSON.stringify(historial)); } catch (e) {}
    }

    function agregarAlHistorial(costo, venta, porcentaje) {
      const nuevoRegistro = { costo, venta, porcentaje };
      if (ultimoRegistroGuardado &&
          ultimoRegistroGuardado.costo === nuevoRegistro.costo &&
          ultimoRegistroGuardado.venta === nuevoRegistro.venta &&
          ultimoRegistroGuardado.porcentaje === nuevoRegistro.porcentaje) return;
      historial.unshift(nuevoRegistro);
      if (historial.length > 20) historial.pop();
      ultimoRegistroGuardado = nuevoRegistro;
      guardarHistorial();
      actualizarVistaHistorial();
    }

    function actualizarVistaHistorial() {
      historialLista.innerHTML = '';
      if (historial.length === 0) {
        historialLista.innerHTML = '<div class="historial-empty">Aún sin cálculos</div>';
        return;
      }
      historial.forEach(function(item) {
        const div = document.createElement('div');
        div.className = 'item-historial';
        div.innerHTML = '<span class="left">' + item.costo + ' → ' + item.venta + '</span>' +
                        '<span class="right">' + item.porcentaje + '</span>';
        historialLista.appendChild(div);
      });
    }

    btnHistorial.addEventListener('click', function(e) {
      lanzarRipple(e);
      historialLista.classList.toggle('abierto');
    });

    function setFocus(grupoId) {
      Object.values(grupos).forEach(function(el) {
        el.classList.remove('active', 'inactive');
      });
      if (grupoId) {
        Object.keys(grupos).forEach(function(key) {
          if (grupos[key].id !== grupoId && grupos[key].style.display !== 'none') {
            grupos[key].classList.add('inactive');
          }
        });
        document.getElementById(grupoId).classList.add('active');
      }
    }

    inputP.addEventListener('focus', function() { setFocus('grupoPaquete'); });
    inputC.addEventListener('focus', function() { setFocus('grupoCantidad'); });
    inputV.addEventListener('focus', function() { setFocus('grupoVenta'); });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.pildora-porcentaje') && !e.target.closest('.grupo-input')) {
        Object.values(grupos).forEach(function(el) {
          el.classList.remove('active', 'inactive');
        });
      }
    });

    function limpiarUI() {
      areaResultados.style.display = 'none';
      grupos.costo.style.display = 'none';
      grupos.costo.classList.remove('levitando');
      document.getElementById('bloqueUnidad').classList.add('oculto');
      document.getElementById('bloquePaquete').classList.add('oculto');
      ultimoRegistroGuardado = null;
    }

    function calcular() {
      const precioBase = parseCRNumber(inputP.value);
      const descuento = parseFloat(inputDescuento.value);
      const iva = parseFloat(inputIVA.value);
      const qty = parseCRNumber(inputC.value);
      const sell = parseCRNumber(inputV.value);

      if (isNaN(precioBase) || isNaN(qty) || qty <= 0) {
        limpiarUI();
        return;
      }

      let precioFinalCompra = precioBase;
      if (descuento > 0) {
        precioFinalCompra = precioBase - (precioBase * (descuento / 100));
      }

      let costoConIVA = precioFinalCompra;
      if (iva > 0) {
        costoConIVA = precioFinalCompra * (1 + (iva / 100));
      }

      const costoUnitario = costoConIVA / qty;
      spanCosto.innerText = formatCRNumber(costoUnitario);
      grupos.costo.style.display = 'block';
      grupos.costo.classList.add('levitando');

      if (isNaN(sell) || sell <= 0) {
        document.getElementById('bloqueUnidad').classList.add('oculto');
        document.getElementById('bloquePaquete').classList.add('oculto');
        areaResultados.style.display = 'block';
        return;
      }

      areaResultados.style.display = 'block';

      const gananciaUnidad = sell - costoUnitario;
      const porcentajeUnidad = (gananciaUnidad / sell) * 100;

      const inversionTotal = costoUnitario * qty;
      const ingresoTotal = sell * qty;
      const gananciaTotal = ingresoTotal - inversionTotal;

      document.getElementById('gananciaUnidad').innerText = formatCRNumber(gananciaUnidad);
      document.getElementById('inversionPaquete').innerText = formatCRNumber(inversionTotal);
      document.getElementById('ingresoPaquete').innerText = formatCRNumber(ingresoTotal);
      document.getElementById('gananciaPaquete').innerText = formatCRNumber(gananciaTotal);

      const colorUnidad = actualizarBarra(porcentajeUnidad, barraUnidad, etiquetasUnidad);

      badgeUnidad.className = 'badge-porcentaje ' + colorUnidad;
      badgeUnidad.innerText = formatearPorcentaje(porcentajeUnidad);

      document.getElementById('bloqueUnidad').classList.remove('oculto');

      if (qty > 1) {
        document.getElementById('bloquePaquete').classList.remove('oculto');
      } else {
        document.getElementById('bloquePaquete').classList.add('oculto');
      }

      agregarAlHistorial(formatCRNumber(costoUnitario), formatCRNumber(sell), formatearPorcentaje(porcentajeUnidad));
    }

    function scheduleCalculation() {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(calcular, 150);
    }

    function applyLiveFormatting(input) {
      let raw = input.value.replace(/[^\d.,]/g, '');
      if (!raw.includes(',') || raw.split(',').length !== 2) {
        let num = parseCRNumber(raw);
        if (!isNaN(num) && isFinite(num)) {
          let intPart = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          input.value = intPart;
        }
      }
    }

    inputP.addEventListener('input', function() {
      applyLiveFormatting(this);
      activarLevitacion(grupos.paquete);
      scheduleCalculation();
      guardarEstadoCampos();
    });
    inputDescuento.addEventListener('input', function() {
      activarLevitacion(pildoraDescuento);
      scheduleCalculation();
      guardarEstadoCampos();
    });
    inputIVA.addEventListener('input', function() {
      activarLevitacion(pildoraIVA);
      scheduleCalculation();
      guardarEstadoCampos();
    });
    inputC.addEventListener('input', function() {
      this.value = this.value.replace(/[^\d]/g, '');
      activarLevitacion(grupos.cantidad);
      scheduleCalculation();
      guardarEstadoCampos();
    });
    inputV.addEventListener('input', function() {
      applyLiveFormatting(this);
      activarLevitacion(grupos.venta);
      scheduleCalculation();
      guardarEstadoCampos();
    });

    cargarHistorial();
    actualizarVistaHistorial();
    limpiarUI();
    restaurarEstadoCampos();
    actualizarTodasLasLevitaciones();
    calcular();

  })();
</script>

</body>
</html>
